<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

         pads with env(safe-area-inset-*) so content stays clear of them -->

    <meta name="theme-color" content="#ffffff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>__TITLE__</title>
    <!-- FONTS: link the design's fonts here (Google Fonts / the team's CDN / files in public/fonts).
         A missing font is the #1 cause of a build that "looks almost right". -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
